name: Refresh prices & deploy

on:
  schedule:
    - cron: '0 18 * * *'  # 毎日 03:00 JST (UTC 18:00) - 取引量少ない時間帯
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write          # output/ や sitemaps/ を commit するため

concurrency:
  group: refresh-prices    # 同時実行を防ぐ
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler 4.x の要件
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch price snapshots (Yahoo / Rakuma / Janpara)
        env:
          RESALE_USE_LIVE_FETCH: '1'         # 実 HTTP fetch を有効化（無いと fixture のみで count:0）
          SNAPSHOT_PRODUCT_IDS: 'iphone13-128,iphone13-256,iphone13mini-128,airpodspro2-lightning,airpodspro2-usbc,switch-oled-white,switch-oled-neon,ipad-air5-64-wifi,ipad-air5-256-wifi,ipad-air5-64-cellular,ipad-air5-256-cellular,ps5-slim-standard,ps5-slim-digital,apple-watch-se2-40-gps,apple-watch-se2-44-gps,apple-watch-se2-44-cellular,iphone14-128,airpods4-anc,ipad-mini6-64-wifi,switch-lite-yellow,ps5-slim-digital-fortnite,apple-watch-s9-45-gps'
        run: npm run snapshot

      - name: Update price history
        run: npm run history

      - name: Build SEO pages (categories / articles / sitemaps)
        run: npm run seo:build

      - name: Build deploy-dist
        run: npm run build:deploy

      - name: Deploy to Cloudflare Workers (kaitorihikaku.net)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.92.0'   # wrangler.jsonc を確実に読める版に固定
          command: deploy

      - name: Update nedan.online D1 (kaitori_price)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NEDAN_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/update-d1-prices.js

      - name: Commit refreshed data back to repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add output/ data/article-manifest.json lib/article-redirects.js sitemaps/ sitemap.xml deploy-dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily price refresh ($(date -u +'%Y-%m-%d'))"
          git push
